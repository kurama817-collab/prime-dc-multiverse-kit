name: Export Canon Bundle

on:
  push:
  pull_request:

jobs:
  export-canon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: engine/validator/package-lock.json

      - name: Install validator deps
        working-directory: engine/validator
        run: npm ci

      - name: Build validator
        working-directory: engine/validator
        run: npm run build

      - name: Validate canon events
        run: node engine/validator/dist/validate-events.js --schema schemas/canon.event.schema.json

      - name: Validate canon objects
        run: node engine/validator/dist/validate-canon.js --schema schemas/canon.object.schema.json

      - name: Validate timeline governance
        run: node engine/validator/dist/validate-timelines.js --schema schemas/canon.timeline.schema.json

      - name: Export canon bundle
        run: node engine/validator/dist/export-canon.js --out dist/canon-bundle --version 0.1.0

      - name: Upload canon bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: canon-bundle
          path: dist/canon-bundle
