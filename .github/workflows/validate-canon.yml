name: Validate Canon Schemas

on:
  push:
  pull_request:

jobs:
  validate-canon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate schema JSON
        run: |
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('schemas/canon.event.schema.json','utf8')); JSON.parse(fs.readFileSync('schemas/canon.object.schema.json','utf8')); console.log('Schema JSON OK');"
