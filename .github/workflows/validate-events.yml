name: Validate eventstreams

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate eventstreams
        working-directory: .
        run: node engine/validator/dist/validate-events.js --schema schemas/canon.event.schema.json
